<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Exercise</title>

    <style>
        .link-amazon {
            color: rgb(0, 113, 133);
        }
        .p1 {
            font-size: 24px;
            font-weight: bold;
        }
        .p2 {
            color: rgb(0, 118, 0);
        }
       
        .button-add {
                background-color: rgb(249, 217, 76);
                border: none;
                height: 30px;
                width: 110px;
                border-radius: 15px;
                margin-right: 8px;
                cursor: pointer;
        }


        .button-buy {
                background-color: rgb(255, 164, 28);
                border: none;
                height: 30px;
                width: 110px;
                border-radius: 15px;
                cursor: pointer;
        }


    </style>
</head>
<body>
   <a href="https://www.amazon.it/" 
        target="_blank"
        class="link-amazon" >
    
    Back to Amazon

   </a> 

   <p class="p1">
    Nike Black Running shoes
   </p>
   <p class="p2">
    $39 - in stock
    </p>
   <p>
    Free delivery tommorow.
   </p>

   <button class="button-add">Add to cart</button>
   <button class="button-buy">Buy Now</button>





</body>
</html>
